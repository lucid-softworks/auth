name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lucid_auth_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lucid_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint the core feature set
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Test the core feature set
        run: cargo test --no-default-features --all-targets
      - name: Lint native SQLite storage
        run: cargo clippy --no-default-features --features sqlite --lib --test sqlite_adapter_contract -- -D warnings
      - name: Test native SQLite storage
        run: cargo test --no-default-features --features sqlite --lib --test sqlite_adapter_contract
      - name: Lint native Cloudflare D1 storage
        run: cargo clippy --no-default-features --features d1 --lib --test d1_adapter_contract -- -D warnings
      - name: Test native Cloudflare D1 storage
        run: cargo test --no-default-features --features d1 --lib --test d1_adapter_contract
      - name: Check Cloudflare D1 Workers package
        run: cargo check --no-default-features --features d1 --target wasm32-unknown-unknown
      - name: Lint all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --all-targets --all-features
      - name: Test PostgreSQL persistence
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lucid_auth_test
        run: |
          cargo test --features postgres --test postgres_contract -- --ignored
          cargo test --features postgres --test scim_postgres_contract -- --ignored
      - name: Install official Better Auth clients
        run: npm ci --prefix conformance --ignore-scripts
      - name: Test the official Better Auth clients
        run: npm test --prefix conformance
      - name: Verify the package
        run: cargo package

  msrv:
    name: Rust 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features
