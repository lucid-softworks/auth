name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lucid_auth_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lucid_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint the core feature set
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Test the core feature set
        run: cargo test --no-default-features --all-targets
      - name: Lint all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --all-targets --all-features
      - name: Test PostgreSQL persistence
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lucid_auth_test
        run: cargo test --features postgres --test postgres_contract -- --ignored
      - name: Verify the package
        run: cargo package

  msrv:
    name: Rust 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features
