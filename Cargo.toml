[package]
name = "lucid-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Native Rust backend for Better Auth clients"
readme = "README.md"
license = "MIT"
repository = "https://github.com/lucid-softworks/auth"
keywords = ["authentication", "better-auth", "axum", "passkey"]
categories = ["authentication", "web-programming"]
exclude = ["conformance/"]

[features]
default = ["axum"]
axum = ["dep:axum", "dep:serde_urlencoded"]
postgres = ["dep:sqlx"]

[dependencies]
argon2 = "0.5"
aes = "0.8"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
ipnet = "2"
jsonwebtoken = { version = "10.2", default-features = false, features = ["rust_crypto"] }
percent-encoding = "2"
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
ryu-js = "1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_cbor_2 = "0.13"
serde_urlencoded = { version = "0.7", optional = true }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-core = "0.5.5"

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "native_plugin"
required-features = ["axum"]

[[example]]
name = "http_memory"
required-features = ["axum"]

[[example]]
name = "http_postgres"
required-features = ["axum", "postgres"]

