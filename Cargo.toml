[package]
name = "lucid-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Native Rust backend for Better Auth clients"
readme = "README.md"
license = "MIT"
repository = "https://github.com/lucid-softworks/auth"
keywords = ["authentication", "better-auth", "axum", "passkey"]
categories = ["authentication", "web-programming"]
exclude = ["conformance/"]

[features]
default = ["axum"]
axum = [
    "dep:axum",
    "dep:flate2",
    "dep:hickory-resolver",
    "dep:serde_urlencoded",
    "dep:samlet",
    "dep:tokio-stream",
    "dep:tower",
    "dep:x509-parser",
]
postgres = [
    "dep:sqlx",
    "sqlx/chrono",
    "sqlx/json",
    "sqlx/macros",
    "sqlx/postgres",
    "sqlx/uuid",
]
mysql = ["dep:sqlx", "sqlx/chrono", "sqlx/json", "sqlx/macros", "sqlx/mysql"]
mongodb = ["dep:mongodb"]
sqlite = ["dep:sqlx", "sqlx/chrono", "sqlx/json", "sqlx/sqlite"]
d1 = ["dep:worker"]

[dependencies]
argon2 = "0.5"
aes = "0.8"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = { version = "1", optional = true }
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
ipnet = "2"
indexmap = "2"
jsonwebtoken = { version = "10.2", default-features = false, features = ["rust_crypto"] }
num-bigint = "0.4"
num-traits = "0.2"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
percent-encoding = "2"
phonenumber = "=0.3.10"
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "form", "gzip", "json", "query", "rustls", "zstd"] }
ryu-js = "1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
serde_cbor_2 = "0.13"
serde_urlencoded = { version = "0.7", optional = true }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio-rustls"] }
thiserror = "2"
tokio-stream = { version = "0.1", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tracing = "0.1"
url = "2"
x509-parser = { version = "0.18.1", optional = true }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
samlet = { version = "0.5", default-features = false, features = ["crypto-aws-lc"], optional = true }

[target.'cfg(not(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
samlet = { version = "0.5", default-features = false, features = ["crypto-rustcrypto"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hickory-resolver = { version = "0.26.1", optional = true, features = ["system-config", "tokio"] }
josekit = "0.10.3"
mongodb = { version = "3.8.2", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-core = "0.5.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
worker = { version = "0.8.5", optional = true, features = ["d1"] }

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

