[package]
name = "lucid-auth-conformance-server"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
hex = "0.4"
lucid-auth = { path = "../..", features = ["axum"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
